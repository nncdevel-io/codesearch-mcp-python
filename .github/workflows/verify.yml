name: verify

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '!docs/spec/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '!docs/spec/**'

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Local dev / devcontainer / build pin to the canonical Python (3.13).
    # CI is the only place we verify the full supported range from
    # `requires-python = ">=3.11"` — fail-fast off so a single-version
    # break does not hide the others.
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']
        include:
          # grimp (pulled in by import-linter) publishes no cp315 wheels yet,
          # and building it from source needs rustc >= 1.94. The import
          # contracts are static and version-independent, so they are checked
          # on the other versions; 3.15 skips installing and running them.
          - python-version: '3.15'
            skip-imports: true

    steps:
      - uses: actions/checkout@v6

      - name: Install ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Install Node (for markdownlint-cli2)
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install markdownlint-cli2 and cspell
        run: npm install -g markdownlint-cli2@0.22.1 cspell@10.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies (locked)
        if: ${{ !matrix.skip-imports }}
        run: uv sync --frozen

      - name: Sync dependencies (locked, without import-linter)
        if: ${{ matrix.skip-imports }}
        run: uv sync --frozen --no-install-package import-linter --no-install-package grimp

      - name: Run full verify pipeline
        if: ${{ !matrix.skip-imports }}
        run: make verify
        env:
          NO_PROXY: 127.0.0.1,localhost

      - name: Run verify pipeline without import contracts
        if: ${{ matrix.skip-imports }}
        # UV_NO_SYNC keeps `uv run` from re-installing the skipped packages.
        run: make lint format-check types test audit md spell
        env:
          NO_PROXY: 127.0.0.1,localhost
          UV_NO_SYNC: '1'
